[project]
name = "crm-experiment-lab"
version = "0.1.0"
description = "CRM campaign experimentation lab — why porting product A/B logic to CRM breaks, and what fixes it (segment-stage randomization, global control group, send balancer, net-of-unsubscribe effect)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "matplotlib>=3.11.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest",
    "ruff",
    "scipy-stubs>=1.17.1.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP009"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
